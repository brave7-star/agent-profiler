[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-profiler"
version = "0.1.0.dev0"
description = "Read-only profiler for personal agent stacks"
requires-python = ">=3.10"

[project.scripts]
agent-profiler = "agent_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
